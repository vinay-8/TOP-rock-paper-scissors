<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./javascript.js" defer></script>
</head>
<body>
   <div class="body">
        <div class="heading">
            <h1>ROCK-PAPER-SCISSORS</h1>
        </div>
        <div class="interface">
            <div class="user-interface">
                <div>USER</div>
                <div class="game-button-container">
                    <button>Rock</button>
                    <button>Paper</button>
                    <button>Scissors</button>
                </div>
                <div class="user-choice"></div>
                <div class="user-win-counter">WINS: 0</div>
            </div>
            <div class="game-instructions-container">
                <div class="game-instructions">Start the game!</div>
            </div>
            <div class="computer-interface">
                Computer
                <div class="computer-choice">Computer chose: </div>
                <div class="computer-win-counter">WINS: 0</div>
            </div>
        </div>
        <div class="footer">
            Copyright (C) VKR 2026
        </div>
   </div>

</body>
</html>
